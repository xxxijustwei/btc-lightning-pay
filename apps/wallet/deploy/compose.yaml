services:
  wallet-service:
    build:
      context: ../../..
      dockerfile: apps/wallet/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      WALLET_HOST: 0.0.0.0
      WALLET_PORT: "9741"
      WALLET_TOKEN: ${WALLET_TOKEN:?Set WALLET_TOKEN}
      BREEZ_API_KEY: ${BREEZ_API_KEY:?Set BREEZ_API_KEY}
      # The mnemonic is read from a mounted secret file, never from the environment.
      BREEZ_MNEMONIC_FILE: /run/secrets/breez_mnemonic
      BREEZ_IDENTITY_PUBKEY: ${BREEZ_IDENTITY_PUBKEY:?Set BREEZ_IDENTITY_PUBKEY}
      BREEZ_DATABASE_URL: ${BREEZ_DATABASE_URL:?Set the PostgreSQL URL for btc_wallet}
    secrets:
      - breez_mnemonic
    expose:
      - "9741"
    # Shared with the cloudflared container, which publishes the wallet through Cloudflare Tunnel.
    networks:
      - dokploy-network
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "--no-env-file",
          "-e",
          "fetch('http://127.0.0.1:9741/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  # Created by Dokploy; elsewhere run `docker network create dokploy-network` once.
  dokploy-network:
    external: true
secrets:
  breez_mnemonic:
    file: ${BREEZ_MNEMONIC_SECRET_FILE:?Set the path of a file holding only the mnemonic}
