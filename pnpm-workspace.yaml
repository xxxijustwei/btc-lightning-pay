allowBuilds:
  better-sqlite3: false # SDK uses PostgreSQL, not its optional SQLite backend.
  esbuild: true
  workerd: true

# Vite+ bundles its Vite fork as version 1.6.0; only its test peers need this allowance.
peerDependencyRules:
  allowedVersions:
    "vitest>vite": 1.6.0
    "@vitest/mocker>vite": 1.6.0

minimumReleaseAgeExclude:
  - miniflare@5.20261116.0-beta
  - wrangler@4.163.0
